<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script type="module">
        import {InputSpinner} from "/static/InputSpinner.js";

        document.addEventListener("DOMContentLoaded", function () {
            const inputSpinners = document.querySelectorAll("input[type='number']");
            inputSpinners.forEach(input => {
                new InputSpinner(input);
            });
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>

    <link rel="stylesheet" href="/css/index.css">
    <title>User's table</title>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
            <span class="navbar-text me-auto">
                <strong th:text="${user.username}"></strong>
                <span class="ms-1" th:text="' with roles: ' + ${user.rolesAsString}"></span>
            </span>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-outline-light">Logout</button>
        </form>
    </div>
</nav>

<div class="sidebar-fixed col-3">
    <div class="card-body">
        <ul class="list-group mt-3">
            <li class="list-group-item"
                th:each="user : ${users}"
                th:classappend="${user.id == currentUserId ? 'sidebar-user-active' : ''}">
                <a th:href="@{/admin/user(id=${user.id})}"
                   class="text-decoration-none"
                   th:classappend="${user.id == currentUserId ? 'text-white' : 'text-dark'}">
                    <span th:text="${user.username}"></span>
                </a>
            </li>
        </ul>
    </div>
</div>

<div class="main-content">
    <div class="container mt-5">
        <h1 class="mb-4">Admin panel</h1>

        <nav>
            <div class="nav nav-tabs" id="nav-tab" role="tablist">
                <button class="nav-link active" id="nav-home-tab" data-bs-toggle="tab" data-bs-target="#nav-home"
                        role="tab" aria-controls="nav-home" aria-selected="true">Users table
                </button>
                <button class="nav-link" id="nav-profile-tab" data-bs-toggle="tab" data-bs-target="#nav-profile"
                        role="tab" aria-controls="nav-profile" aria-selected="false">New User
                </button>
            </div>
        </nav>

        <div class="tab-content" id="nav-tabContent">

            <div class="tab-pane fade show active" id="nav-home" role="tabpanel" aria-labelledby="nav-home-tab">
                <h4 class="mt-3 mb-3">All users</h4>
                <table class="table table-striped table-hover">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Age</th>
                        <th>Role</th>
                        <th>Edit</th>
                        <th>Delete</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}"></td>
                        <td th:text="${user.username}"></td>
                        <td th:text="${user.age}"></td>
                        <td>
                    <span th:each="role, iter : ${user.roles}"
                          th:text="${role.name + (iter.last ? '' : ', ')}">Role</span>
                        </td>
                        <td>
                            <button type="button" class="btn btn-sm btn-primary"
                                    data-bs-toggle="modal"
                                    data-bs-target="#editUserModal"
                                    th:attr="data-id=${user.id}, data-username=${user.username}, data-age=${user.age}">
                                Edit
                            </button>
                        </td>
                        <td>
                            <form th:action="@{/admin/delete(id=${user.id})}" method="post" style="display: inline;">
                                <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="tab-pane fade" id="nav-profile" role="tabpanel" aria-labelledby="nav-profile-tab">
                <h4 class="mt-3 mb-3">Add new user</h4>
                <form method="POST" th:action="@{/admin/add-user}" class="needs-validation">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>

                    <div class="mb-3">
                        <label for="age" class="form-label">Age</label>
                        <input
                                type="number"
                                class="form-control"
                                id="age"
                                name="age"
                                value="18"
                                min="0"
                                max="120"
                                step="1"
                                data-decimals="0"
                                required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="mb-3">
                        <label for="role" class="form-label">Roles</label>
                        <select class="form-select" id="role" name="roles" multiple size="2" required>
                            <option th:each="role : ${allRoles}"
                                    th:value="${role.name}"
                                    th:text="${role.name}">
                            </option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-success">Add new user</button>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editUserModal" tabindex="-1" aria-labelledby="editUserModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editUserModalLabel">Редактировать пользователя</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form method="POST" th:action="@{/admin/update}" class="needs-validation">

                        <div class="mb-3">
                            <label for="editUserIdDisplay" class="form-label">ID пользователя</label>
                            <input type="text" class="form-control" id="editUserIdDisplay" disabled>
                            <input type="hidden" name="id" id="editUserIdHidden"/>
                        </div>

                        <div class="mb-3">
                            <label for="editUsername" class="form-label">Username</label>
                            <input type="text" class="form-control" id="editUsername" name="username" required>
                        </div>

                        <div class="mb-3">
                            <label for="editAge" class="form-label">Age</label>
                            <input
                                    type="number"
                                    class="form-control"
                                    id="editAge"
                                    name="age"
                                    value="18"
                                    min="0"
                                    max="120"
                                    step="1"
                                    data-decimals="0"
                                    required>
                        </div>

                        <div class="mb-3">
                            <label for="editPassword" class="form-label">Password</label>
                            <input type="password" class="form-control" id="editPassword" name="password">
                            <small class="form-text text-muted">Оставьте поле пустым, чтобы сохранить текущий
                                пароль</small>
                        </div>

                        <div class="mb-3">
                            <label for="editRoles" class="form-label">Roles</label>
                            <select class="form-select" id="editRoles" name="roles" multiple size="2" required>
                                <option th:each="role : ${allRoles}"
                                        th:value="${role.name}"
                                        th:text="${role.name}">
                                </option>
                            </select>
                            <small class="form-text text-muted">Удерживайте Shift или Ctrl (Cmd на Mac) для выбора
                                нескольких ролей</small>
                        </div>
                        <button type="submit" class="btn btn-primary">Сохранить изменения</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const editModalEl = document.getElementById('editUserModal');

        if (editModalEl) {
            editModalEl.addEventListener('show.bs.modal', function (event) {
                const button = event.relatedTarget;
                const id = button.getAttribute('data-id');
                const username = button.getAttribute('data-username');
                const age = button.getAttribute('data-age');
                if (age) {
                    document.getElementById('editAge').value = age;
                } else {
                    document.getElementById('editAge').value = '18';
                }
                document.getElementById('editUserIdDisplay').value = id;
                document.getElementById('editUserIdHidden').value = id;
                document.getElementById('editUsername').value = username;
                document.getElementById('editPassword').value = '';
                const rolesSelect = document.getElementById('editRoles');
                Array.from(rolesSelect.options).forEach(option => {
                    option.selected = false;
                });
            });

            editModalEl.addEventListener('hidden.bs.modal', function () {
                document.getElementById('editUserIdDisplay').value = '';
                document.getElementById('editUserIdHidden').value = '';
                document.getElementById('editPassword').value = '';
                Array.from(document.getElementById('editRoles').options).forEach(option => {
                    option.selected = false;
                });
            });
        }
    });
</script>
</body>
</html>
